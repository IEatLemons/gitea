# Railway config-as-code: https://docs.railway.com/reference/config-as-code
#
# Required service variables (set in Railway dashboard, not committed here):
# - GITEA__server__HTTP_PORT = ${{PORT}}
# - GITEA__server__ROOT_URL = https://${{RAILWAY_PUBLIC_DOMAIN}}/
#
# Persistent volume: mount at container path /data (SQLite + repositories + config).
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
