# Railway config-as-code: https://docs.railway.com/reference/config-as-code
#
# Required service variables (set in Railway dashboard, not committed here):
# - GITEA__server__HTTP_PORT = ${{PORT}}
# - GITEA__server__ROOT_URL = https://${{RAILWAY_PUBLIC_DOMAIN}}/
#
# Persistent volume (required for Git data across redeploys):
# - Create and attach a Railway Volume in the dashboard; mounts cannot be declared in this file.
# - Mount path MUST be /data (matches Dockerfile VOLUME and docker template app.ini:
#   APP_DATA_PATH=/data/gitea, [repository] ROOT=/data/git/repositories).
# - Without this, redeploys replace the container filesystem and repos disappear while DB rows may remain
#   ("unable to read Git data" / repo.broken_message). See contrib/railway/README.md.
"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
